apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: node-hello-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Yashwani14/node-express-hello-world.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
