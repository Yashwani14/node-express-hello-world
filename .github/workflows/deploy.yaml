name: Deploy to Kubernetes

on:
  push:
    branches:
      - main
    paths:
      - 'k8s/**'
      - 'chart/**'
      - 'argocd/**'
      - '.github/workflows/deploy.yaml'
      - 'Dockerfile'
      - 'app.js'
      - 'package.json'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/node-express-hello-world -n default --timeout=5m

  deploy-with-helm:
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, '[helm]')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v3

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Deploy with Helm
        run: |
          helm upgrade --install node-express-hello-world ./chart \
            --namespace default \
            --create-namespace \
            --values chart/values.yaml

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/node-express-hello-world -n default --timeout=5m

  deploy-with-argocd:
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, '[argocd]')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Trigger ArgoCD sync
        run: |
          kubectl apply -f argocd/app.yaml

      - name: Wait for ArgoCD to sync
        run: |
          kubectl wait --for=condition=SyncStatusCodeHealthStatusCodeUnknown \
            -l app.kubernetes.io/instance=node-express-hello-world \
            --timeout=300s
